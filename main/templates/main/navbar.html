<header class="navbar">
    <div class="container nav-inner">
        <a href="{% url 'main:home' %}" class="brand">
            <span class="brand-mark">GC</span>
            <span class="brand-name">Golden Crust</span>
        </a>
        <nav class="nav-menu" id="navMenu">
            <a href="{% url 'main:home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
            <a href="{% url 'main:about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
            <a href="{% url 'main:menu' %}" class="{% if request.resolver_match.url_name == 'menu' %}active{% endif %}">Menu</a>
            <a href="{% url 'main:gallery' %}" class="{% if request.resolver_match.url_name == 'gallery' %}active{% endif %}">Gallery</a>
            <a href="{% url 'main:contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a>
        </nav>
        <button class="burger" id="burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>
<script>
document.getElementById('burger').addEventListener('click', () => {
    document.getElementById('navMenu').classList.toggle('open');
});
</script>
